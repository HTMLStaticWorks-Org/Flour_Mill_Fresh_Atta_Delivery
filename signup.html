<!doctype html><html lang="en" dir="ltr" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Create your Fresh Chakki account to customize single-origin grains, grind textures and fresh atta delivery."><title>Signup | Fresh Chakki</title><link rel="icon" type="image/png" href="assets/images/favicon.png"><link rel="apple-touch-icon" href="assets/images/favicon.png"><link rel="stylesheet" href="assets/css/style.css"></head><body>
<main class="auth-page">
  <div class="auth-topbar">
    <div class="auth-controls">
      <button class="icon-btn" type="button" data-theme-toggle title="Change theme" aria-label="Switch theme">☾</button>
      <button class="rtl-btn" type="button" data-rtl-toggle>RTL</button>
    </div>
  </div>

  <div class="auth-shell">
    <form class="auth-card" id="signup-card" data-demo-form data-message="Account created! Welcome to Fresh Chakki.">
      <div class="auth-header">
        <a class="auth-brand-link" href="index.html" aria-label="Fresh Chakki home">
          <img class="auth-logo" src="assets/images/fresh-chakki-logo.png" alt="Fresh Chakki – Flour Mill and Fresh Atta Delivery">
        </a>
        <h1>Create Account</h1>
        <p>Save your grain preferences, stone-grind settings and doorstep delivery schedule.</p>
      </div>

      <div class="field">
        <label for="full-name">Full name</label>
        <input id="full-name" type="text" required autocomplete="name" placeholder="e.g. Arjun Mehta">
      </div>

      <div class="field">
        <label for="signup-email">Email address</label>
        <input id="signup-email" type="email" required autocomplete="email" placeholder="arjun.mehta@gmail.com">
      </div>

      <div class="field">
        <label for="signup-phone">Phone number</label>
        <input id="signup-phone" type="tel" required autocomplete="tel" placeholder="+91 98765 43210">
      </div>

      <div class="field">
        <label for="signup-password">Create password</label>
        <div class="pw-input-wrap">
          <input id="signup-password" type="password" minlength="8" required autocomplete="new-password" data-password-main placeholder="Minimum 8 characters">
          <button class="pw-toggle-btn" type="button" data-password-toggle="signup-password" aria-label="Show password" aria-pressed="false">
            <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M1.5 12s3.8-7 10.5-7 10.5 7 10.5 7-3.8 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 5.2A10.6 10.6 0 0 1 12 5c6.7 0 10.5 7 10.5 7a18.4 18.4 0 0 1-3.2 4.2M6.2 6.2C3.6 8 1.5 12 1.5 12s3.8 7 10.5 7a10.6 10.6 0 0 0 5.1-1.3"/></svg>
          </button>
        </div>
      </div>

      <div class="field">
        <label for="signup-confirm-password">Confirm password</label>
        <div class="pw-input-wrap">
          <input id="signup-confirm-password" type="password" minlength="8" required autocomplete="new-password" data-password-confirm placeholder="Re-enter your password">
          <button class="pw-toggle-btn" type="button" data-password-toggle="signup-confirm-password" aria-label="Show confirm password" aria-pressed="false">
            <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M1.5 12s3.8-7 10.5-7 10.5 7 10.5 7-3.8 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 5.2A10.6 10.6 0 0 1 12 5c6.7 0 10.5 7 10.5 7a18.4 18.4 0 0 1-3.2 4.2M6.2 6.2C3.6 8 1.5 12 1.5 12s3.8 7 10.5 7a10.6 10.6 0 0 0 5.1-1.3"/></svg>
          </button>
        </div>
      </div>

      <div class="field">
        <label for="signup-address">Delivery address</label>
        <textarea id="signup-address" rows="3" required placeholder="House number, street, locality, Bengaluru – 560038"></textarea>
      </div>

      <div class="field">
        <label class="terms-check-row" for="signup-terms">
          <input type="checkbox" id="signup-terms" required>
          <span>I agree to the <a href="about.html" class="auth-inline-link">Terms &amp; Conditions</a> and <a href="contact.html" class="auth-inline-link">Privacy Policy</a> of Fresh Chakki.</span>
        </label>
      </div>

      <div class="auth-error" data-form-error role="alert"></div>

      <button class="btn btn-primary auth-submit-btn" type="submit">Create Account</button>

      <div class="auth-divider"><span>or sign up with</span></div>

      <div class="auth-social-stack">
        <button class="auth-social-btn" type="button" data-social-auth="Google">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#EA4335" d="M12 10.2v3.9h5.5c-.2 1.3-1.6 3.8-5.5 3.8-3.3 0-6-2.7-6-6s2.7-6 6-6c1.9 0 3.1.8 3.8 1.5l2.6-2.5C16.8 3.4 14.6 2.5 12 2.5 6.8 2.5 2.5 6.8 2.5 12s4.3 9.5 9.5 9.5c5.5 0 9.1-3.9 9.1-9.3 0-.6-.1-1.1-.2-1.6H12Z"/>
            <path fill="#34A853" d="M3.6 7.3l3.2 2.4C7.7 7.5 9.7 6 12 6c1.9 0 3.1.8 3.8 1.5l2.6-2.5C16.8 3.4 14.6 2.5 12 2.5 8.3 2.5 5.2 4.6 3.6 7.3Z"/>
            <path fill="#FBBC05" d="M12 21.5c2.5 0 4.7-.8 6.3-2.3l-2.9-2.4c-.8.6-1.9 1.1-3.4 1.1-3.8 0-5.2-2.5-5.5-3.8l-3.2 2.5c1.6 3 4.8 4.9 8.7 4.9Z"/>
            <path fill="#4285F4" d="M21.1 12.2c0-.6-.1-1.1-.2-1.6H12v3.9h5.5c-.3 1.2-1.1 2.2-2.1 2.9l2.9 2.4c1.7-1.6 2.8-4 2.8-7.6Z"/>
          </svg>
          <span>Continue with Google</span>
        </button>

        <button class="auth-social-btn" type="button" data-social-auth="Facebook">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#1877F2" d="M22 12a10 10 0 1 0-11.56 9.88v-6.99H7.9V12h2.54V9.8c0-2.5 1.49-3.89 3.78-3.89 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56V12h2.77l-.44 2.89h-2.33v6.99A10 10 0 0 0 22 12Z"/>
          </svg>
          <span>Continue with Facebook</span>
        </button>
      </div>

      <p class="auth-switch-text">Already registered? <a href="login.html">Login</a></p>
    </form>
  </div>
</main>
<div class="toast" role="status" aria-live="polite"></div>
<script src="assets/js/main.js"></script></body></html>
